services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dragoncourt
      POSTGRES_USER: dcuser
      POSTGRES_PASSWORD: dcpass123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcuser -d dragoncourt"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=dragoncourt;Username=dcuser;Password=dcpass123"
      Jwt__Key: "RustyDaggerSuperSecretKeyForDragonCourt2025!"
      Jwt__Issuer: "RustyDagger"
      Jwt__Audience: "RustyDagger"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
